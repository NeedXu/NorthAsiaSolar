name: Daily intelligence and Pages deployment
on:
  push:
    branches: [main]
    paths-ignore: ['.deploy/access-request.json','scripts/source-probe.py','.github/workflows/source-validation.yml','.deploy/source-probe.json']
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai; GitHub may delay scheduled jobs.
permissions:
  contents: read
concurrency:
  group: north-asia-pipeline
  cancel-in-progress: false
jobs:
  collect:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      failed: ${{ steps.collect.outcome == 'failure' || steps.translate.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse fresh data for interface-only changes
        id: data
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt,json,os,re,subprocess
          needs=True
          if os.environ['EVENT_NAME']=='push':
              event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
              before=event.get('before','');after=event.get('after','')
              if re.fullmatch(r'[a-f0-9]{40}',before) and set(before)!={'0'}:
                  changed=subprocess.check_output(['git','diff','--name-only',before,after],text=True).splitlines()
                  needs=any(p.startswith(('scripts/collect.py','scripts/translate.py','scripts/sources.json','requirements-')) for p in changed)
                  try:
                      feed=json.load(open('public/data/feed.json'))
                      captured=dt.datetime.fromisoformat(feed['attemptedAt'])
                      needs=needs or dt.datetime.now(dt.timezone.utc)-captured>dt.timedelta(hours=20)
                  except (ValueError,TypeError,KeyError):needs=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('collect='+str(needs).lower()+'\n')
          PY
      - run: python -m pip install -r requirements-collector.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect RSS (retain archive on source failures)
        id: collect
        if: steps.data.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/collect.py
      - uses: actions/cache@v4
        if: steps.data.outputs.collect == 'true'
        with:
          path: ~/.cache/huggingface/hub/models--facebook--m2m100_418M
          key: m2m100-418m-mit-v1
      - name: Install local translation runtime (no paid API)
        if: steps.data.outputs.collect == 'true'
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-translation.txt
      - name: Translate original titles and evidence into Chinese
        id: translate
        if: steps.data.outputs.collect == 'true'
        continue-on-error: true
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: python scripts/translate.py
      - name: Save archive and source health
        if: steps.data.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh North Asia RSS archive'
            bash scripts/push-main.sh
          fi
  public-access:
    needs: collect
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: check
        run: echo "enabled=$(node scripts/access-control.mjs)" >> "$GITHUB_OUTPUT"
  build:
    needs: [collect, public-access]
    if: needs.public-access.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify homepage and published feed
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify-site.py
      - name: Record verified website URL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy/site-status.json
          git commit -m 'ops: record verified live website'
          bash scripts/push-main.sh
  collection-health:
    needs: [collect, deploy]
    if: always() && needs.collect.outputs.failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'RSS collection failed or partially failed. Latest source health was saved; inspect the collection log.'
          exit 1
