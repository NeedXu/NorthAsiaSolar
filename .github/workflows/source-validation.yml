name: Validate local-language sources
on:
  push:
    branches: [main]
    paths: ['scripts/source-probe.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Probe public sources and included Models access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/source-probe.py
      - name: Save source validation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy/source-probe.json
          git commit -m 'ops: record local-language source validation'
          bash scripts/push-main.sh
