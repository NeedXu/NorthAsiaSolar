name: 公开访问开关
on:
  push:
    branches: [main]
    paths: ['.deploy/access-request.json']
  workflow_dispatch:
    inputs:
      action:
        description: 'close 撤下应用与新闻 / open 重新开放（需要仓库权限）'
        type: choice
        required: true
        default: close
        options: [close, open]
permissions:
  contents: read
concurrency:
  group: north-asia-pipeline
  cancel-in-progress: false
jobs:
  access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      action: ${{ steps.request.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate requested action
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const action = process.env.EVENT_NAME === 'workflow_dispatch'
            ? process.env.MANUAL_ACTION
            : JSON.parse(fs.readFileSync('.deploy/access-request.json','utf8')).action;
          if (!['open','close'].includes(action)) throw Error('Invalid access request');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `action=${action}\n`);
          JS
      - name: Block application deployment first
        run: |
          node -e "require('fs').writeFileSync('.deploy/public-access.json', JSON.stringify({enabled:false})+'\n')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy/public-access.json
          if ! git diff --cached --quiet; then
            git commit -m 'ops: disable public deployment'
            bash scripts/push-main.sh
          fi
      - name: Ensure Pages is configured for workflow deployments
        env:
          ACCESS_ACTION: open
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pages-control.mjs
      - name: Enable daily application deployment on open only
        if: steps.request.outputs.action == 'open'
        run: |
          node -e "require('fs').writeFileSync('.deploy/public-access.json', JSON.stringify({enabled:true})+'\n')"
          git add .deploy/public-access.json
          git commit -m 'ops: enable public deployment'
          bash scripts/push-main.sh
  build:
    needs: access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: needs.access.outputs.action == 'open'
        with:
          node-version: '24'
          cache: npm
      - if: needs.access.outputs.action == 'open'
        run: npm ci && npm test && npm run build
      - name: Build shutdown page without application or feed
        if: needs.access.outputs.action == 'close'
        run: python3 scripts/build-closed.py
      - name: Preserve prior asset list for shutdown verification
        if: needs.access.outputs.action == 'close'
        uses: actions/upload-artifact@v4
        with:
          name: prior-assets
          path: .deploy/prior-assets.json
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: [access, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.access.outputs.action == 'close'
        with:
          name: prior-assets
          path: .deploy
      - name: Verify application access state and data endpoint
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          ACCESS_ACTION: ${{ needs.access.outputs.action }}
        run: |
          if [ "$ACCESS_ACTION" = close ]; then
            python3 scripts/verify-site.py --closed
          else
            python3 scripts/verify-site.py
          fi
      - name: Save verified access state
        env:
          ACCESS_ACTION: ${{ needs.access.outputs.action }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy/site-status.json
          git commit -m 'ops: record verified website access state'
          bash scripts/push-main.sh
          echo "Verified action: $ACCESS_ACTION" >> "$GITHUB_STEP_SUMMARY"
